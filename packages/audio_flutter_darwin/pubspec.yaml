name: audio_flutter_darwin
description: macOS implementation of audio_flutter capture and PCM playback.
version: 0.3.0
resolution: workspace
homepage: https://github.com/kshdotdev/audio-kit-dart
repository: https://github.com/kshdotdev/audio-kit-dart
issue_tracker: https://github.com/kshdotdev/audio-kit-dart/issues
topics:
  - audio
  - flutter
  - macos
platforms:
  macos:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  audio_flutter_platform_interface: ^0.2.1
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    implements: audio_flutter
    platforms:
      macos:
        pluginClass: AudioFlutterDarwinPlugin
        dartPluginClass: AudioFlutterDarwin
        sharedDarwinSource: true
